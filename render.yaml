services:
  # ============================================================================
  # Backend API (FastAPI + ChromaDB + RAG)
  # ============================================================================
  - type: web
    name: ai-developer-assistant-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon # Available: oregon, frankfurt, singapore, ohio
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: MOCK_MODE
        value: "false"
      - key: API_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MONGODB_DATABASE
        value: ai_developer_assistant
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false

